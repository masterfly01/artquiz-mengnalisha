<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>🎨 蒙娜丽莎 · 闯关测试（对错可见）</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(145deg, #f7efe1 0%, #e8dccc 100%);
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 18px;
        }
        .test-card {
            max-width: 820px;
            width: 100%;
            background: rgba(255, 248, 235, 0.85);
            backdrop-filter: blur(4px);
            border-radius: 56px 56px 48px 48px;
            padding: 32px 28px 42px;
            box-shadow: 0 20px 40px rgba(100, 70, 40, 0.25), 0 4px 12px rgba(0,0,0,0.1);
            border: 1px solid #ede3d0;
            transition: all 0.2s;
        }
        h1 {
            font-size: 2.1rem;
            font-weight: 600;
            color: #4d3a2a;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            border-bottom: 3px dashed #c9b69a;
            padding-bottom: 18px;
            margin-bottom: 22px;
            letter-spacing: -0.3px;
        }
        h1 small {
            font-size: 1rem;
            font-weight: 400;
            color: #7f6a54;
            margin-left: 6px;
        }
        .question-block {
            background: #fffcf5;
            border-radius: 32px;
            padding: 20px 22px 18px;
            margin-bottom: 22px;
            box-shadow: 0 6px 14px rgba(140, 100, 70, 0.08);
            border: 1px solid #e7d8c4;
            transition: 0.2s;
            position: relative;
        }
        .question-block.correct {
            border-left: 8px solid #3a9b6a;
            background: #f6fff9;
        }
        .question-block.wrong {
            border-left: 8px solid #c55a4a;
            background: #fff7f5;
        }
        .q-title {
            display: flex;
            align-items: baseline;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .q-num {
            background: #b7a186;
            color: #fcf3e6;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 4px 14px;
            border-radius: 40px;
            letter-spacing: 0.3px;
        }
        .q-type {
            font-size: 0.85rem;
            background: #e5d5c0;
            color: #4f3c2b;
            padding: 2px 16px;
            border-radius: 30px;
            font-weight: 500;
        }
        .q-text {
            font-size: 1.2rem;
            font-weight: 500;
            color: #2d241b;
            margin: 8px 0 14px 0;
            line-height: 1.5;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 6px 0 4px;
        }
        .opt-label {
            display: flex;
            align-items: center;
            gap: 14px;
            background: #f6efe6;
            padding: 12px 18px;
            border-radius: 60px;
            border: 1px solid #dfd0bd;
            transition: all 0.15s;
            cursor: pointer;
            font-size: 1.05rem;
            color: #2e241c;
        }
        .opt-label:hover {
            background: #efe4d6;
            border-color: #bca98e;
        }
        .opt-label input[type="checkbox"],
        .opt-label input[type="radio"] {
            width: 20px;
            height: 20px;
            accent-color: #7f6244;
            flex-shrink: 0;
            cursor: pointer;
        }
        .opt-label input:disabled + span {
            opacity: 0.9;
        }
        /* 提交后状态样式 */
        .opt-label.correct-option {
            background: #d4edda;
            border-color: #3a9b6a;
        }
        .opt-label.wrong-option {
            background: #f8ddda;
            border-color: #c55a4a;
        }
        .opt-label.missed-option {
            background: #ffe9e0;
            border-color: #d68a7a;
            opacity: 0.85;
        }
        .result-badge {
            display: inline-block;
            margin-left: 14px;
            font-weight: 600;
            font-size: 0.95rem;
        }
        .badge-correct {
            color: #1f7a4a;
        }
        .badge-wrong {
            color: #b14535;
        }
        .action-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin: 28px 0 16px;
            gap: 14px;
        }
        .btn {
            background: #dac9b4;
            border: none;
            padding: 14px 32px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1.2rem;
            color: #3f3224;
            border: 1px solid #c7b39b;
            box-shadow: 0 4px 0 #b49d84;
            transition: 0.08s linear;
            cursor: pointer;
            flex: 1 1 auto;
            min-width: 130px;
            letter-spacing: 0.5px;
            background: #e4d4be;
        }
        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #b49d84;
        }
        .btn-primary {
            background: #aa8b70;
            border-color: #8d735b;
            color: #fef7ed;
            box-shadow: 0 4px 0 #715b47;
        }
        .btn-primary:active {
            box-shadow: 0 1px 0 #715b47;
        }
        .btn:disabled {
            opacity: 0.5;
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b49d84;
            pointer-events: none;
        }
        .score-area {
            background: #3b3229;
            border-radius: 60px;
            padding: 16px 24px;
            color: #f5ede2;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px 10px;
            margin-top: 18px;
            border: 1px solid #5f4d3a;
        }
        .score-badge {
            display: flex;
            align-items: baseline;
            gap: 12px;
            flex-wrap: wrap;
        }
        .score-number {
            font-size: 2.1rem;
            font-weight: 700;
            background: #5b4a38;
            padding: 0 18px;
            border-radius: 60px;
            line-height: 1.4;
            color: #fbeedc;
        }
        .rank-box {
            background: #5b4a38;
            padding: 6px 22px;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: 500;
            color: #fbebd6;
            white-space: nowrap;
        }
        .rank-box span {
            font-weight: 700;
            color: #ffdbb5;
        }
        .footer-note {
            text-align: center;
            margin-top: 24px;
            font-size: 0.95rem;
            color: #6b5b4a;
            border-top: 1px solid #dccdba;
            padding-top: 20px;
            letter-spacing: 0.4px;
        }
        .reset-area {
            display: flex;
            justify-content: flex-end;
        }
        .btn-reset {
            background: #cfbcab;
            color: #2f241b;
            padding: 8px 22px;
            font-size: 1rem;
            min-width: 80px;
            flex: 0 1 auto;
            box-shadow: 0 3px 0 #a28d78;
        }
        @media (max-width: 520px) {
            .test-card { padding: 22px 16px; }
            h1 { font-size: 1.7rem; }
            .q-text { font-size: 1.05rem; }
            .opt-label { font-size: 0.95rem; padding: 10px 14px; }
            .btn { padding: 12px 16px; font-size: 1rem; }
            .score-number { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
<div class="test-card" id="app">
    <h1>
        🖼️ 蒙娜丽莎·闯关
        <small>🔍 对错可见 · 错题不露答案</small>
    </h1>

    <div id="questionsContainer"></div>

    <div class="action-bar">
        <button class="btn btn-primary" id="submitBtn">✅ 提交答案</button>
        <div class="reset-area">
            <button class="btn btn-reset" id="resetBtn">🔄 重玩</button>
        </div>
    </div>

    <div class="score-area" id="scoreArea">
        <div class="score-badge">
            <span style="font-size:1.2rem;">🏆 得分</span>
            <span class="score-number" id="scoreDisplay">0</span>
            <span style="font-size:1rem;">/ 16</span>
        </div>
        <div class="rank-box" id="rankDisplay">
            <span>🌟</span> 艺术小种子
        </div>
    </div>
    <div class="footer-note">
        ⭐ 提交后绿色边框=答对，红色边框=答错（错题不显示正确答案，可自己再思考）
    </div>
</div>

<script>
    (function() {
        // ---------- 题库 (与之前相同) ----------
        const QUESTIONS = [
            { id: 1, type: 'single', text: '《蒙娜丽莎》诞生于哪个伟大的艺术时期？', options: ['A. 古希腊时期', 'B. 文艺复兴时期', 'C. 印象派时期', 'D. 现代主义时期'], answer: [1] },
            { id: 2, type: 'single', text: '这幅画最可能创作于哪个世纪？', options: ['A. 14世纪', 'B. 15世纪', 'C. 16世纪', 'D. 17世纪'], answer: [2] },
            { id: 3, type: 'multi', text: '关于《蒙娜丽莎》的创作背景，以下哪些说法是正确的？', options: ['A. 它是受佛罗伦萨一位丝绸商委托绘制的', 'B. 达·芬奇一直把画带在身边，到去世都没交给委托人', 'C. 这幅画是为教堂祭坛创作的宗教画', 'D. 画作诞生时，人们开始重视“人”本身的价值，而不是只关注神'], answer: [0,1,3] },
            { id: 4, type: 'single', text: '达·芬奇除了是画家，还是一位著名的____。', options: ['A. 解剖学家和发明家', 'B. 职业足球运动员', 'C. 歌剧演员', 'D. 皇帝'], answer: [0] },
            { id: 5, type: 'multi', text: '关于达·芬奇创作这幅画时的状态，以下哪些是对的？', options: ['A. 他断断续续画了十几年', 'B. 他用科学的方法研究人体和光线', 'C. 他三天就画完了', 'D. 这幅画是他晚年在法国完成的'], answer: [0,1,3] },
            { id: 6, type: 'single', text: '画中女士最广为接受的身份是？', options: ['A. 法国皇后', 'B. 佛罗伦萨商人德尔·乔孔多的妻子丽莎', 'C. 达·芬奇的母亲', 'D. 一位古希腊女神'], answer: [1] },
            { id: 7, type: 'single', text: '蒙娜丽莎最著名的特点是什么？', options: ['A. 她戴着一顶王冠', 'B. 她嘴角那抹神秘微笑', 'C. 她抱着一个婴儿', 'D. 她穿着红色长袍'], answer: [1] },
            { id: 8, type: 'multi', text: '关于画面背景，以下哪些描述是正确的？', options: ['A. 背景是城市街道', 'B. 背景有蜿蜒的小路和山水', 'C. 左右两侧的地平线高度不一样', 'D. 背景全部是纯黑色的'], answer: [1,2] },
            { id: 9, type: 'single', text: '达·芬奇让轮廓线模糊消失的独特技法叫什么？', options: ['A. 点彩法', 'B. 晕涂法（Sfumato）', 'C. 刮刀法', 'D. 泼墨法'], answer: [1] },
            { id: 10, type: 'single', text: '这种技法需要在画布上做什么？', options: ['A. 涂一层厚厚的石膏', 'B. 叠加数十层超级薄的透明油彩', 'C. 用刀刮出纹理', 'D. 贴金箔'], answer: [1] },
            { id: 11, type: 'multi', text: '关于《蒙娜丽莎》的构图，以下哪些说法正确？', options: ['A. 人物身体形成稳定的三角形构图', 'B. 背景中的风景线条与人物衣褶的曲线相呼应', 'C. 人物正面朝向观众，手臂交叉在胸前', 'D. 画中没有使用任何透视法'], answer: [0,1,2] },
            { id: 12, type: 'single', text: '为什么蒙娜丽莎的微笑看起来时有时无？', options: ['A. 因为画在室外会变色', 'B. 因为嘴角和眼角的阴影模糊，让我们大脑不断“脑补”情绪', 'C. 因为画本身会动', 'D. 因为看太久眼睛会花'], answer: [1] },
            { id: 13, type: 'multi', text: '以下哪些心理感受是观众常有的？', options: ['A. 开心时看她是微笑，疲惫时看她是忧郁', 'B. 她像一面镜子，映照出我们自己的心情', 'C. 所有人都觉得她笑得很开心', 'D. 背景的山水让人感觉宁静又神秘'], answer: [0,1,3] },
            { id: 14, type: 'single', text: '《蒙娜丽莎》在1911年发生了什么大事？', options: ['A. 被博物馆卖掉', 'B. 被盗走了', 'C. 被洪水冲坏', 'D. 被涂改'], answer: [1] },
            { id: 15, type: 'single', text: '以下哪位艺术家曾恶搞过《蒙娜丽莎》，给她画上胡子？', options: ['A. 毕加索', 'B. 梵高', 'C. 杜尚', 'D. 莫奈'], answer: [2] },
            { id: 16, type: 'multi', text: '如今这幅画的状态是怎样的？', options: ['A. 放在巴黎卢浮宫博物馆', 'B. 外面罩着防弹玻璃', 'C. 任何人都可以随便触摸', 'D. 每天被成千上万人隔着玻璃拍照'], answer: [0,1,3] }
        ];

        const TOTAL = QUESTIONS.length;

        function getRank(score) {
            if (score >= 13) return { emoji: '🏆', label: '蒙娜丽莎小博士' };
            if (score >= 9) return { emoji: '🌟', label: '名画小侦探' };
            return { emoji: '🌱', label: '艺术小种子' };
        }

        const container = document.getElementById('questionsContainer');
        const submitBtn = document.getElementById('submitBtn');
        const resetBtn = document.getElementById('resetBtn');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const rankDisplay = document.getElementById('rankDisplay');

        // ---------- 渲染题目 ----------
        function renderQuestions() {
            let html = '';
            QUESTIONS.forEach((q, idx) => {
                const qId = `q${idx}`;
                const typeLabel = q.type === 'single' ? '⭐ 单选' : '★★ 多选';
                const inputType = q.type === 'single' ? 'radio' : 'checkbox';
                const nameAttr = q.type === 'single' ? `name="${qId}"` : '';

                html += `<div class="question-block" data-qidx="${idx}" id="block-${idx}">`;
                html += `<div class="q-title"><span class="q-num">${idx+1}</span><span class="q-type">${typeLabel}</span>`;
                html += `<span class="result-badge" id="badge-${idx}"></span>`;
                html += `</div>`;
                html += `<div class="q-text">${q.text}</div>`;
                html += `<div class="options" id="options-${idx}">`;

                q.options.forEach((optText, optIdx) => {
                    const val = String(optIdx);
                    html += `<label class="opt-label" id="optlabel-${idx}-${optIdx}">`;
                    html += `<input type="${inputType}" ${nameAttr} value="${val}" data-q="${idx}" data-opt="${optIdx}">`;
                    html += `<span>${optText}</span>`;
                    html += `</label>`;
                });

                html += `</div></div>`;
            });
            container.innerHTML = html;
        }

        // ---------- 获取用户选择 ----------
        function getUserSelections() {
            const allInputs = container.querySelectorAll('input[type="radio"], input[type="checkbox"]');
            const selections = {};
            allInputs.forEach(input => {
                const qIdx = parseInt(input.dataset.q, 10);
                if (!selections[qIdx]) selections[qIdx] = [];
                if (input.checked) {
                    selections[qIdx].push(parseInt(input.dataset.opt, 10));
                }
            });
            return selections;
        }

        // ---------- 计算得分 & 逐题对错 ----------
        function getDetailedResult(selections) {
            const result = {
                score: 0,
                details: []  // 每项: { correct: boolean, userAns: [], correctAns: [] }
            };
            for (let i = 0; i < QUESTIONS.length; i++) {
                const q = QUESTIONS[i];
                const userAns = selections[i] || [];
                const correctAns = q.answer.slice().sort();
                const sortedUser = userAns.slice().sort();
                const isCorrect = JSON.stringify(sortedUser) === JSON.stringify(correctAns);
                if (isCorrect) result.score++;
                result.details.push({
                    correct: isCorrect,
                    userAns: userAns.slice(),
                    correctAns: correctAns
                });
            }
            return result;
        }

        // ---------- 更新UI显示对错 (但不显示正确答案) ----------
        function applyResultDetails(details) {
            for (let i = 0; i < details.length; i++) {
                const block = document.getElementById(`block-${i}`);
                const badge = document.getElementById(`badge-${i}`);
                const detail = details[i];
                // 清除之前的状态
                block.classList.remove('correct', 'wrong');
                if (detail.correct) {
                    block.classList.add('correct');
                    badge.innerHTML = '✅ <span style="color:#1f7a4a;">答对啦</span>';
                } else {
                    block.classList.add('wrong');
                    badge.innerHTML = '❌ <span style="color:#b14535;">再想想</span>';
                }

                // 处理每个选项的样式：只标记用户选错/漏选，不标记正确答案
                const q = QUESTIONS[i];
                const userAns = detail.userAns;
                const correctAns = detail.correctAns; // 保留但不用来显示正确

                for (let optIdx = 0; optIdx < q.options.length; optIdx++) {
                    const label = document.getElementById(`optlabel-${i}-${optIdx}`);
                    const input = label?.querySelector('input');
                    if (!label) continue;
                    // 清除状态
                    label.classList.remove('correct-option', 'wrong-option', 'missed-option');

                    const isUserSelected = userAns.includes(optIdx);
                    // 只对用户的选择做标记
                    if (isUserSelected) {
                        // 如果用户选了，判断是否在正确答案里
                        if (correctAns.includes(optIdx)) {
                            // 选对了 (属于正确答案)
                            label.classList.add('correct-option');
                        } else {
                            // 选错了 (选了不该选的)
                            label.classList.add('wrong-option');
                        }
                    } else {
                        // 用户没选，但如果是正确答案且用户漏选 —— 我们标记为“漏选”但只做提示，不显示正确答案
                        if (correctAns.includes(optIdx)) {
                            // 漏选：用另一种样式表示“你可能漏掉了这个”
                            label.classList.add('missed-option');
                        }
                        // 否则什么也不加
                    }
                }
            }
        }

        // ---------- 更新成绩UI ----------
        function updateScore(score) {
            scoreDisplay.textContent = score;
            const rank = getRank(score);
            rankDisplay.innerHTML = `<span>${rank.emoji}</span> ${rank.label}`;
        }

        // ---------- 禁用所有输入 (提交后) ----------
        function disableAllInputs(disabled = true) {
            const inputs = container.querySelectorAll('input');
            inputs.forEach(inp => inp.disabled = disabled);
        }

        // ---------- 提交逻辑 ----------
        function handleSubmit() {
            const selections = getUserSelections();
            let allAnswered = true;
            for (let i = 0; i < QUESTIONS.length; i++) {
                if (!selections[i] || selections[i].length === 0) {
                    allAnswered = false;
                    break;
                }
            }
            if (!allAnswered) {
                alert('🧐 还有题目没有作答呢！每道题至少选一个选项再提交吧～');
                return;
            }

            const result = getDetailedResult(selections);
            updateScore(result.score);
            applyResultDetails(result.details);
            disableAllInputs(true);
            submitBtn.disabled = true;
            document.getElementById('scoreArea').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // ---------- 重置全部 ----------
        function handleReset() {
            const inputs = container.querySelectorAll('input');
            inputs.forEach(inp => {
                inp.checked = false;
                inp.disabled = false;
            });
            // 清除所有附加样式
            const blocks = container.querySelectorAll('.question-block');
            blocks.forEach(block => {
                block.classList.remove('correct', 'wrong');
            });
            const badges = container.querySelectorAll('.result-badge');
            badges.forEach(b => b.innerHTML = '');
            const optLabels = container.querySelectorAll('.opt-label');
            optLabels.forEach(label => {
                label.classList.remove('correct-option', 'wrong-option', 'missed-option');
            });
            submitBtn.disabled = false;
            updateScore(0);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ---------- 初始化 ----------
        function init() {
            renderQuestions();
            updateScore(0);
            submitBtn.addEventListener('click', handleSubmit);
            resetBtn.addEventListener('click', handleReset);
        }

        init();
    })();
</script>
</body>
</html>
